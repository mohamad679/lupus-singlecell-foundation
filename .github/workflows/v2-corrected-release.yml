name: v2 corrected release gate

on:
  push:
    branches: [v2-corrected-maintenance]

permissions:
  contents: write

jobs:
  reproduce-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Reproduce corrected results
        run: bash scripts/37_reproduce_corrected_results.sh
      - name: Create v2-corrected tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v2-corrected >/dev/null 2>&1; then
            echo "v2-corrected already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v2-corrected -m "Corrected V1 lupus reanalysis"
          git push origin v2-corrected
          gh release create v2-corrected             --title "v2-corrected — corrected V1 lupus reanalysis"             --notes "Corrected Geneformer V1 reanalysis. Shared-gene external AUROCs: Geneformer 0.7344, pseudobulk 0.8984, age 0.5781. This is a corrected reanalysis on an already examined external cohort. The historical commit 6158a840 is preserved."
