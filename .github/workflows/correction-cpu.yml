name: Corrected analysis CPU checks

on:
  pull_request:
  push:
    branches: [scientific-correction-2026]

jobs:
  correction-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scoring dependencies
        run: python -m pip install -r requirements_correction_scoring.txt pytest
      - name: Check correction protocol and inference
        run: python -m pytest -q tests/test_correction_protocol.py tests/test_scientific_correction.py
      - name: Check script syntax
        run: python -m compileall -q scripts/correction_protocol.py scripts/27_correction_analysis.py scripts/28_corrected_geneformer_scoring.py scripts/35_ingest_corrected_kaggle_zip.py
