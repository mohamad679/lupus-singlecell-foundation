<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Corrected donor-level SLE classifier workflow</title>
<desc id="desc">Professional workflow diagram showing development and external cohorts, feature construction, Geneformer V1, pseudobulk and age-only analysis arms, development model fitting, external reanalysis, statistical analysis, additional analyses and final AUROC results.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#16385f"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16385f" flood-opacity=".10"/>
  </filter>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#102b52}.h1{font-size:38px;font-weight:800}.sub{font-size:19px;fill:#526982}
    .boxTitle{font-size:23px;font-weight:750}.boxSub{font-size:16px;fill:#3e536c}.small{font-size:14px;fill:#526982}
    .result{font-size:31px;font-weight:850}.line{stroke:#16385f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .branch{stroke:#16385f;stroke-width:2.5;fill:none}.card{stroke-width:2;rx:14;filter:url(#shadow)}
  </style>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text class="t h1" x="800" y="50" text-anchor="middle">Corrected donor-level SLE classifier workflow</text>
<text class="t sub" x="800" y="82" text-anchor="middle">Corrected Geneformer V1, pseudobulk, and age-baseline reanalysis across development and external cohorts</text>

<!-- cohort cards -->
<rect class="card" x="85" y="110" width="640" height="92" fill="#eef7ff" stroke="#45a1ff"/>
<circle cx="145" cy="145" r="14" fill="#2c83dd"/><circle cx="180" cy="139" r="17" fill="#2c83dd"/><circle cx="213" cy="146" r="13" fill="#2c83dd"/>
<path d="M121 178c2-21 14-30 26-30s24 9 26 30M157 178c2-25 15-36 26-36 13 0 28 11 30 36M196 178c2-21 13-30 25-30 13 0 24 9 26 30" fill="#2c83dd" opacity=".95"/>
<text class="t boxTitle" x="265" y="148">Development cohort — Perez et al.</text>
<text class="t boxSub" x="265" y="178">261 donors · 162 SLE / 99 healthy</text>

<rect class="card" x="875" y="110" width="640" height="92" fill="#f4f0ff" stroke="#7c69e8"/>
<ellipse cx="940" cy="137" rx="26" ry="10" fill="#7158d5"/><rect x="914" y="137" width="52" height="38" fill="#7158d5"/><ellipse cx="940" cy="175" rx="26" ry="10" fill="#7158d5"/>
<path d="M914 150c0 5 12 10 26 10s26-5 26-10" stroke="#efeaff" stroke-width="3" fill="none"/>
<text class="t boxTitle" x="1000" y="148">Previously examined external cohort — GSE135779</text>
<text class="t boxSub" x="1000" y="178">56 samples · 40 SLE / 16 healthy</text>

<!-- converge -->
<path class="branch" d="M405 202 V224 H800"/><path class="branch" d="M1195 202 V224 H800"/><path class="line" d="M800 224 V248"/>

<!-- feature construction -->
<rect class="card" x="535" y="250" width="530" height="64" fill="#f5f8fb" stroke="#9fb4c9"/>
<circle cx="600" cy="282" r="18" fill="none" stroke="#526982" stroke-width="7"/>
<path d="M600 255v12M600 297v12M573 282h12M615 282h12M581 263l9 9M610 292l9 9M619 263l-9 9M590 292l-9 9" stroke="#526982" stroke-width="5"/>
<text class="t boxTitle" x="650" y="290">Donor-level feature construction</text>

<!-- branches to analysis arms -->
<path class="branch" d="M800 314 V336 H330 V360"/><path class="branch" d="M800 314 V360"/><path class="branch" d="M800 336 H1270 V360"/>
<path class="line" d="M330 336 V360"/><path class="line" d="M800 336 V360"/><path class="line" d="M1270 336 V360"/>

<!-- analysis arms -->
<rect class="card" x="95" y="362" width="470" height="82" fill="#eef7ff" stroke="#45a1ff"/>
<path d="M155 382c28 20 28 24 0 43M182 382c-28 20-28 24 0 43M158 388h21M154 400h31M154 413h31M158 425h21" stroke="#2c83dd" stroke-width="4" fill="none"/>
<text class="t boxTitle" x="220" y="396" fill="#176bc0">Geneformer V1</text><text class="t boxSub" x="220" y="424">shared-gene donor embeddings · primary</text>

<rect class="card" x="565" y="362" width="470" height="82" fill="#effaf0" stroke="#58b86d"/>
<rect x="625" y="405" width="12" height="22" rx="2" fill="#12934b"/><rect x="645" y="390" width="12" height="37" rx="2" fill="#12934b"/><rect x="665" y="374" width="12" height="53" rx="2" fill="#12934b"/>
<text class="t boxTitle" x="705" y="396" fill="#147843">Pseudobulk</text><text class="t boxSub" x="705" y="424">donor-level expression baseline</text>

<rect class="card" x="1035" y="362" width="470" height="82" fill="#fff4ea" stroke="#f19a3e"/>
<rect x="1098" y="378" width="39" height="49" rx="5" fill="#e96e0c"/><path d="M1108 391h20M1108 401h20M1108 411h20" stroke="#fff" stroke-width="3"/>
<text class="t boxTitle" x="1170" y="396" fill="#c95b07">Age only</text><text class="t boxSub" x="1170" y="424">metadata baseline</text>

<!-- convergence -->
<path class="branch" d="M330 444 V468 H800"/><path class="branch" d="M1270 444 V468 H800"/><path class="line" d="M800 444 V488"/>

<!-- model fitting -->
<rect class="card" x="500" y="490" width="600" height="68" fill="#f4f0ff" stroke="#9e91ea"/>
<circle cx="560" cy="524" r="8" fill="#284b84"/><circle cx="535" cy="543" r="8" fill="#284b84"/><circle cx="585" cy="543" r="8" fill="#284b84"/><path d="M560 532v9M560 541h-25M560 541h25" stroke="#284b84" stroke-width="4"/>
<text class="t boxTitle" x="625" y="518">Development cohort model fitting</text><text class="t boxSub" x="625" y="544">nested cross-validation logistic models</text>
<path class="line" d="M800 558 V580"/>

<!-- external reanalysis -->
<rect class="card" x="500" y="582" width="600" height="68" fill="#eef7ff" stroke="#45a1ff"/>
<rect x="545" y="615" width="11" height="18" rx="2" fill="#267acb"/><rect x="563" y="603" width="11" height="30" rx="2" fill="#267acb"/><rect x="581" y="590" width="11" height="43" rx="2" fill="#267acb"/>
<text class="t boxTitle" x="625" y="610">External reanalysis</text><text class="t boxSub" x="625" y="636">fixed-model evaluation on the previously examined cohort</text>
<path class="line" d="M800 650 V672"/>

<!-- stats -->
<rect class="card" x="500" y="674" width="600" height="68" fill="#f5f8fb" stroke="#9fb4c9"/>
<rect x="548" y="689" width="36" height="43" rx="4" fill="none" stroke="#254d78" stroke-width="4"/><path d="M555 702h21M555 711h12M555 723h6M565 723v-8M573 723v-14" stroke="#254d78" stroke-width="3"/>
<text class="t boxTitle" x="625" y="702">Statistical analysis</text><text class="t boxSub" x="625" y="728">AUROC · 95% bootstrap CI · paired comparisons · Holm adjustment</text>

<!-- additional analyses -->
<rect x="1165" y="492" width="350" height="250" rx="16" fill="#f8fbfe" stroke="#a9bfd4" stroke-width="2" stroke-dasharray="8 7"/>
<circle cx="1204" cy="529" r="14" fill="none" stroke="#254d78" stroke-width="4"/><path d="M1214 539l14 14" stroke="#254d78" stroke-width="5"/>
<text class="t boxTitle" x="1250" y="536">Additional analyses</text>
<line x1="1190" y1="560" x2="1490" y2="560" stroke="#d3deea"/>
<text class="t" x="1200" y="594" font-size="17" font-weight="700">Gene-input sensitivity</text><text class="t small" x="1200" y="615">shared-gene vs native</text>
<text class="t" x="1200" y="650" font-size="17" font-weight="700">Post-hoc cohort-membership</text><text class="t small" x="1200" y="671">diagnostic</text>
<text class="t" x="1200" y="706" font-size="17" font-weight="700">CPU reproduction and CI verification</text>

<!-- result branch -->
<path class="branch" d="M800 742 V768 H330"/><path class="branch" d="M800 768 H1270"/>
<path class="line" d="M330 768 V790"/><path class="line" d="M800 742 V790"/><path class="line" d="M1270 768 V790"/>

<!-- results -->
<rect class="card" x="95" y="792" width="470" height="78" fill="#eef7ff" stroke="#45a1ff"/>
<text class="t boxTitle" x="135" y="824">Geneformer V1</text><text class="t result" x="135" y="858">AUROC 0.7344</text>
<rect class="card" x="565" y="792" width="470" height="78" fill="#effaf0" stroke="#58b86d"/>
<text class="t boxTitle" x="605" y="824" fill="#147843">Pseudobulk</text><text class="t result" x="605" y="858">AUROC 0.8984</text>
<rect class="card" x="1035" y="792" width="470" height="78" fill="#fff4ea" stroke="#f19a3e"/>
<text class="t boxTitle" x="1075" y="824" fill="#c95b07">Age only</text><text class="t result" x="1075" y="858">AUROC 0.5781</text>

<text class="t small" x="800" y="892" text-anchor="middle">Corrected reanalysis of a previously examined external cohort; not a new untouched confirmatory validation.</text>
</svg>