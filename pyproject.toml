[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lupus-singlecell-foundation"
version = "2.0.0"
description = "Corrected donor-level Geneformer V1, pseudobulk, and age-baseline analysis for SLE classification."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
